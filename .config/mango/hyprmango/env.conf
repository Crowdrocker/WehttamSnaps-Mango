# env=NAME,value — first comma separates name from value (value may contain ; etc.)
# ─────────────────────────────────────────────────────────────────────────────
# Environment variables
# Converted from niri's `environment { KEY "value" }` block to mango's
# `env=KEY,VALUE` lines. These are applied before mango finishes initializing.
# NOTE: mango re-applies these on every config reload (Mod+Shift+R / reload_config).
# ─────────────────────────────────────────────────────────────────────────────

# Cursor theme (also set natively for mango itself in 80-layout-and-monitors.conf
# via cursor_theme / cursor_size — this env copy is for apps that only read env vars)
#  env=XCURSOR_THEME,Catppuccin-Mocha-Dark-Cursors
env=XCURSOR_SIZE,24

# Qt platform / theming
env=QT_QPA_PLATFORM,wayland;xcb
# Pick one toolkit theme; qt6ct is typical on current distros
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=GDK_BACKEND,wayland

# Browser Wayland support
env=MOZ_ENABLE_WAYLAND,1
env=CHROMIUM_FLAGS,--enable-features=UseOzonePlatform --ozone-platform=wayland

# AMD GPU specific optimizations
# NOTE: RADV_PERFTEST's value itself contains a comma ("aco,rt"). mango's env=
# parser splits on the FIRST comma only (KEY,VALUE), so this should come through
# intact — but if RADV features don't seem to apply, set it in a shell profile
# or /etc/environment instead as a fallback.
env=RADV_PERFTEST,aco,rt
env=mesa_glthread,true
env=AMD_VULKAN_ICD,RADV

# Tell apps which compositor/session is running.
# niri used XDG_CURRENT_DESKTOP=niri; mango is wlroots-based like sway, so
# "wlroots" is the value mango's own docs use for portals/xdg-desktop-portal-wlr.
env=XDG_CURRENT_DESKTOP,Mango
env=XDG_SESSION_TYPE,wayland
env=XDG_DESKTOP_PORTAL,mango
# Use Plasma's app-menu prefix so kbuildsycoca6 indexes .desktop files
# and Dolphin/Nautilus "Open With" menus work correctly.
env=XDG_MENU_PREFIX,plasma-

# Electron apps Wayland support
env=OZONE_PLATFORM,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
# SDL Wayland support
env=SDL_VIDEODRIVER,wayland

# Clutter Wayland support
env=CLUTTER_BACKEND,wayland

# Java applications fix
env=_JAVA_AWT_WM_NONREPARENTING,1

# Wine/Proton
env=WINEDEBUG,-all

# Editor
env=EDITOR,nano
env=VISUAL,nano

# WehttamSnaps custom
env=WEHTTAMSNAPS_VERSION,2.0.0
env=JARVIS_MODE,jarvis
