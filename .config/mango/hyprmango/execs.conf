# Startup — mango uses exec-once=command (no Hyprland exec arrays). Use sh -c for shell operators.

# Quickshell (background if it does not daemonize on its own)
exec-once=sh -c 'qs &'

# Core (authentication)
exec-once=gnome-keyring-daemon --start --components=secrets

# DBus / portals
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=/usr/libexec/xdg-desktop-portal
exec-once=/usr/libexec/xdg-desktop-portal-wlr

# X11 apps: relax local X access (optional; tighten if you do not need it)
exec-once=sh -c 'xhost +local: 2>/dev/null || true'

# ═══════════════════════════════════════════════════════════════════════════════
# 40 — STARTUP
# niri's `spawn-at-startup` / `spawn-sh-at-startup` -> mango's `exec-once=`
# (runs once at launch) / `exec=` (re-runs on every config reload).
# Everything below runs through a shell already, so no extra quoting needed —
# just paste the command as you'd type it in a terminal.
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Sound System ───
# Absolute path here on purpose — exec-once runs early, before your normal
# shell PATH is guaranteed to be set up, and a bare `sound-system` call was
# confirmed to fail the same way it did in keybinds (see NOTES.md).
exec-once=bash -c "/usr/local/bin/sound-system startup"

# ─── Noctalia Shell ───
# Noctalia's launcher/controlCenter/settings IPC calls (bound in 10-keybinds.conf)
# are just `qs` IPC calls and should work fine under mango. Noctalia is built
# and tested primarily against niri though — if you see visual glitches
# (workspace indicator, overview) that's Noctalia's niri-specific module, not
# a mango config issue. Check Noctalia's docs for a generic/wlroots mode.
# exec-once=noctalia

# ─── Wallpaper ───
exec-once=swww-daemon

# ─── Status Bar ───
# Uncomment if using Waybar. mangowm's own bar is "mangobar" if you want to
# try that instead — see the status-bar wiki page.
# exec-once=waybar

# ─── Polkit Authentication Agent ───
exec-once=/usr/lib/polkit-kde-authentication-agent-1
#exec-once=/usr/lib/polkit-gnome-authentication-agent-1

# ─── Notification Daemon ───
exec-once=dunst

# ─── Clipboard Manager ───
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store

# ─── Night Light ───
# exec-once=wlsunset -l 37.7749 -L -122.4194

# ─── Input Method ───
# exec-once=fcitx5 -d

# ─── WehttamSnaps Welcome App ───
exec-once=bash -c "sleep 2 && python3 ~/.config/wehttamsnaps/scripts/wehttamsnaps-welcome.py"

# ─── GAMING / COMMS (optional, keep commented like the original) ───
# exec-once=steam -silent
# exec-once=discord --start-minimized

# ═══════════════════════════════════════════════════════════════════════════════
# From your old 70-environment.kdl startup block
# ═══════════════════════════════════════════════════════════════════════════════

# Keyboard repeat rate: mango has NATIVE repeat_rate / repeat_delay settings
# (see 80-layout-and-monitors.conf) which is the correct way to do this now —
# xkbset is an X11 tool and mostly a no-op under native Wayland clients. Left
# here commented for XWayland app compatibility if you still notice issues:
# exec-once=xkbset repeat rate 300 50

# Export XDG_MENU_PREFIX into the systemd user session and rebuild the
# sycoca database so KDE/Qt apps see the correct .desktop entries.
exec-once=bash -c "systemctl --user import-environment XDG_MENU_PREFIX && kbuildsycoca6"

# XWayland
exec-once=xwayland-satellite

# Config watcher for real-time validation
exec-once=bash -c "~/.config/wehttamsnaps/scripts/config-watcher.sh start &"

# Save list of currently installed programs
exec-once=~/.config/wehttamsnaps/scripts/save-program-list.sh

# niriswitcher is a niri-only alt-tab switcher (talks to niri's IPC) and will
# NOT work under mango — do not start it. mango has its own switcher-ish
# tools built in instead:
#   - focusstack next/prev  -> cycle focus within the current tag's stack
#   - toggleoverview / togglejump -> visual overview / jump-to-window mode
# These are already bound in 10-keybinds.conf. If you want a floating
# Alt-Tab-style HUD like niriswitcher gave you, look at `swayr` or a
# rofi-based window switcher instead.
# exec-once=niriswitcher

exec-once=udiskie --tray
exec-once=blueman-applet
exec-once=nm-applet

# ─── TriggerCmd (remote command execution — shutdown, scripts, media, apps) ───
# Runs inside this session (not a systemd/root daemon) so it inherits
# WAYLAND_DISPLAY / XDG_RUNTIME_DIR / MANGO_INSTANCE_SIGNATURE correctly.
# See extras/triggercmd/README.md for the one-time setup (registering the
# computer + getting a token) that has to happen BEFORE uncommenting this.
# exec-once=node ~/.local/share/triggercmd-agent/src/agent.js --console

# Idle/lock/DPMS handling. swayidle itself is compositor-agnostic (wlroots
# idle protocol), but the niri-specific "niri msg action power-off-monitors" /
# "power-on-monitors" calls need to become per-monitor mmsg dispatch calls.
# Adjust DP-1 / DP-2 if your monitor names ever change (check `wlr-randr`).
exec-once=sh -c "swayidle -w timeout 600 'swaylock' timeout 900 'mmsg dispatch disable_monitor,DP-1 && mmsg dispatch disable_monitor,DP-2' resume 'mmsg dispatch enable_monitor,DP-1 && mmsg dispatch enable_monitor,DP-2' before-sleep 'swaylock'"
