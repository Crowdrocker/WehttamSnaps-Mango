# Key Bindings
# Format: bind[flags]=MODIFIERS,KEY,COMMAND,PARAMETERS
# Modifiers: SUPER, CTRL, ALT, SHIFT, NONE
# Flags: l (lock screen), r (release), s (keysym), p (pass through)
# spawn = no shell; use spawn_shell for | && || $() &

# ==============================
# Core System
# ==============================
# SUPER,r = lowercase keysym (physical R, no shift). SUPER,R = Shift+Super+r only.
# Keep Mango default reload chord on SUPER+r for muscle-memory.
bind=SUPER,r,reload_config
bind=CTRL+SHIFT,r,reload_config
bind=SUPER+ALT,m,quit
bind=SUPER,q,spawn,sh -c "/usr/local/bin/sound-system window-close && mmsg dispatch killclient"

# ==============================
# Applications
# ==============================
bind=ALT,space,spawn,rofi -show drun
bind=ALT,Return,spawn,foot
bind=SUPER,T,spawn,ptyxis --new-window
bind=SUPER+ALT,slash,spawn_shell,pkill fuzzel || fuzzel

# ─────────────────────────────────────────────────────────────────────────
# 💻 CORE APPLICATIONS (with J.A.R.V.I.S. sounds)
# ─────────────────────────────────────────────────────────────────────────
bind=SUPER,Return,spawn,sh -c "/usr/local/bin/sound-system open-terminal && ghostty"
bind=SUPER+SHIFT,Return,spawn,kitty
bind=SUPER+ALT,b,spawn,sh -c "/usr/local/bin/sound-system launch-firefox && firefox"
bind=SUPER+SHIFT,b,spawn,sh -c "/usr/local/bin/sound-system launch-brave && brave"
bind=SUPER,e,spawn,sh -c "/usr/local/bin/sound-system open-files && dolphin"
bind=SUPER+SHIFT,t,spawn,sh -c "/usr/local/bin/sound-system launch-kate && kate"
bind=SUPER+SHIFT,o,spawn,sh -c "/usr/local/bin/sound-system launch-obs && obs"
bind=ALT+SHIFT,p,spawn,sh -c "/usr/local/bin/sound-system launch-spotify && spotify-launcher"


# ─────────────────────────────────────────────────────────────────────────
# 🌐 WEBAPPS (Mod+Ctrl) - No sounds for quick web app access
# ─────────────────────────────────────────────────────────────────────────
bind=SUPER+CTRL,y,spawn,brave --app=https://youtube.com --profile-directory='YouTube'
bind=SUPER+CTRL,t,spawn,brave --app=https://twitch.tv --profile-directory='Twitch'
bind=SUPER+CTRL,s,spawn,brave --app=https://open.spotify.com --profile-directory='Spotify'
bind=SUPER+CTRL,d,spawn,brave --app=https://discord.com/app --profile-directory='Discord'

# ─────────────────────────────────────────────────────────────────────────
# 🎮 GAMING & PERFORMANCE
# ─────────────────────────────────────────────────────────────────────────
#bind=SUPER+SHIFT,g,spawn,/usr/local/bin/sound-system gaming-toggle
bind=SUPER+SHIFT,s,spawn,sh -c "/usr/local/bin/sound-system steam-launch && steam"

# ─────────────────────────────────────────────────────────────────────────
# ⚡ WEHTTAMSNAPS SPECIFIC
# ─────────────────────────────────────────────────────────────────────────
bind=SUPER,h,spawn,~/.config/wehttamsnaps/scripts/keyhints.sh
bind=SUPER+SHIFT,w,spawn,workmode
bind=SUPER+SHIFT,g,spawn,gamemode
#bind=SUPER+ALT,slash,spawn,/usr/local/bin/jarvis-menu command
bind=SUPER+ALT,j,spawn,/usr/local/bin/jarvis-menu
bind=SUPER+ALT,g,spawn,python3 /home/wehttamsnaps/.config/wehttamsnaps/scripts/game-launcher.py

# ==============================
# Window Focus
# ==============================
# Focus cycle on Ctrl+Tab.
bind=CTRL,Tab,focusstack,next
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# ==============================
# Window Management
# ==============================
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

bind=ALT,backslash,togglefloating
bind=SUPER+ALT,Space,togglefloating
bind=ALT,f,togglefullscreen
bind=ALT+SHIFT,f,togglefakefullscreen
bind=ALT,a,togglemaximizescreen
bind=SUPER,i,minimized
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER,o,toggleoverlay
bind=SUPER,g,toggleglobal
bind=ALT,z,toggle_scratchpad

# Mango overview (compositor) — was duplicate chord with ALT+Tab + qs below
bind=SUPER+ALT,Tab,toggleoverview

# ==============================
# Layouts
# ==============================
bind=SUPER,n,switch_layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# ==============================
# Move & Resize Windows
# ==============================
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# ==============================
# Workspace (Tag) Management
# ==============================
bind=CTRL,1,view,1,0
bind=CTRL,2,view,2,0
bind=CTRL,3,view,3,0
bind=CTRL,4,view,4,0
bind=CTRL,5,view,5,0
bind=CTRL,6,view,6,0
bind=CTRL,7,view,7,0
bind=CTRL,8,view,8,0
bind=CTRL,9,view,9,0

bind=ALT,1,tag,1,0
bind=ALT,2,tag,2,0
bind=ALT,3,tag,3,0
bind=ALT,4,tag,4,0
bind=ALT,5,tag,5,0
bind=ALT,6,tag,6,0
bind=ALT,7,tag,7,0
bind=ALT,8,tag,8,0
bind=ALT,9,tag,9,0

bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

# ==============================
# Monitor Navigation
# ==============================
bind=ALT+SHIFT,Left,focusmon,left
bind=ALT+SHIFT,Right,focusmon,right
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right

# ==============================
# QuickShell & Widgets
# ==============================
bind=SUPER,slash,spawn,quickshell ipc call cheatsheet toggle
bind=SUPER,Tab,spawn_shell,qs ipc call workspaceoverview toggle
bind=CTRL+SHIFT,Tab,spawn,quickshell --overview
bind=SUPER,B,spawn,quickshell --toggle-bar
bind=SUPER,M,spawn,quickshell ipc call simpleMediaPlayer toggle
bind=SUPER,K,spawn,quickshell --toggle-keyboard
bind=SUPER+SHIFT,D,spawn,quickshell ipc call dash toggle
bind=SUPER,a,spawn,qs ipc call Spotlight toggle
bind=SUPER,s,spawn,qs ipc call settings toggle
bind=ALT,Tab,spawn,qs ipc call overview toggle
bind=SUPER,0,spawn_shell,qs &
bind=SUPER,P,spawn,qs ipc call pikapack toggle
bind=SUPER,W,spawn,qs ipc call weather toggle
bind=SUPER,Y,spawn,qs ipc call setting toggle
bind=SUPER,C,spawn,qs ipc call calendar open

# ==============================
# Media Keys
# ==============================
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=ALT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle
bind=SUPER+SHIFT,M,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0%
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# ─────────────────────────────────────────────────────────────────────────
# 📸 SCREENSHOTS
# ─────────────────────────────────────────────────────────────────────────
# Screenshots
bind=NONE,F10,spawn,$HOME/.config/mango/scripts/screenshot.sh fullscreen
bind=SHIFT,F10,spawn,$HOME/.config/mango/scripts/screenshot.sh region
bind=CTRL+SHIFT,F10,spawn,$HOME/.config/mango/scripts/screenshot.sh window
bind=CTRL+SUPER,F10,spawn,$HOME/.config/mango/scripts/screenshot.sh freeze
bind=SHIFT+SUPER,F10,spawn,$HOME/.config/mango/scripts/screenshot.sh freeze-region
bind=SUPER,F10,spawn,$HOME/.config/mango/scripts/screenshot.sh annotate

bind=SUPER,V,spawn_shell,pkill fuzzel || cliphist list | fuzzel --match-mode fzf --dmenu | cliphist decode | wl-copy
bind=SUPER,period,spawn_shell,pkill fuzzel || ~/.local/bin/fuzzel-emoji
bind=SUPER+SHIFT,C,spawn,hyprpicker -a

# Recording
bind=SUPER+ALT,R,spawn,~/.config/ags/scripts/record-script.sh
bind=CTRL+ALT,R,spawn,~/.config/ags/scripts/record-script.sh --fullscreen
bind=SUPER+SHIFT+ALT,R,spawn,~/.config/ags/scripts/record-script.sh --fullscreen-sound

# ==============================
# System & Session (SUPER,K = quickshell keyboard above)
# ==============================
bind=CTRL+SUPER,K,spawn,loginctl lock-session
bind=SUPER+SHIFT,L,spawn_shell,sleep 0.1 && systemctl suspend || loginctl suspend
bind=CTRL+SHIFT+ALT+SUPER,Delete,spawn_shell,systemctl poweroff || loginctl poweroff
bind=CTRL+ALT,Delete,spawn,quickshell --toggle-power

# Reload on release — use lowercase r (same physical key as CTRL+SUPER+r reload, no Shift)
bindr=CTRL+SUPER+ALT,r,reload_config

# ==============================
# Mouse Bindings
# ==============================
mousebind=NONE,btn_middle,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ==============================
# Axis Bindings
# ==============================
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
