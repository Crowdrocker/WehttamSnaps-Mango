# Quickshell matugen — Otter Shell terminal (otter-term) color fragment.
# Written to: ~/.config/otter-shell/otter-term/otter-term-matugen.conf
#
# Add once to your otter-term config (absolute path, tilde is not expanded), e.g.:
#   import = "/home/<you>/.config/otter-shell/otter-term/otter-term-matugen.conf"
# Enable: Quickshell → Settings → Templates → "Otter / otter-term".
#
# Keys match otter-term’s flattened colors_* fields (otter-conf quoted #RRGGBB strings).
# 16-color mapping follows the same roles as matugen/kitty.conf (Material + base16), using .default.

colors_foreground = "#e0e2e8"
colors_background = "#101418"
colors_cursor = "#9dcbfb"
colors_selection_background = "#124a73"
colors_url_foreground = "#b9c8da"

colors_black = "#101418"
colors_bright_black = "#32353a"

colors_red = "#ff1b74"
colors_bright_red = "#ffb4d1"

colors_green = "#b9c8da"
colors_bright_green = "#d5e4f7"

colors_yellow = "#d4bee6"
colors_bright_yellow = "#f0dbff"

colors_blue = "#124a73"
colors_bright_blue = "#9dcbfb"

colors_magenta = "#3a4857"
colors_bright_magenta = "#b9c8da"

colors_cyan = "#504060"
colors_bright_cyan = "#d4bee6"

colors_white = "#c2c7cf"
colors_bright_white = "#e0e2e8"
