# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# WEHTTAMSNAPS MANGOWM - KEYBINDINGS CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Converted from niri's `binds { KEY { spawn ... } }` blocks to mango's flat
# `bind[flags]=MODIFIERS,KEY,DISPATCHER,PARAMS` lines.
#   - "Mod" -> SUPER
#   - plain `spawn "app"` (no shell operators)      -> spawn,<cmd>
#   - anything with `&&`, `sh -c`, `$(...)`, quotes  -> spawn,<cmd>
#   - `l` flag ("locked" in niri)                    -> bindl= (allow-when-locked)
# mangowm converts keysyms to keycodes automatically, so plain key names below
# should work across layouts. If one doesn't fire, rebind with `code:NN`
# (find the code with `wev`).
#
# IMPORTANT — TAGS VS NIRI WORKSPACES:
# niri gave you 11 *named* workspaces split across two monitors. mangowm uses
# 9 numbered TAGS PER MONITOR (each monitor has its own independent 1-9 set),
# so Mod+1..9 switches tags on whichever monitor is currently focused. See
# 30-tags.conf for the name->number mapping and NOTES.md for the full
# explanation of why "Leu" still fits without losing a workspace.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ─────────────────────────────────────────────────────────────────────────
# 🐚 NOCTALIA SHELL / LAUNCHER
# ─────────────────────────────────────────────────────────────────────────
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER, s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle

# Hardware Keys (Volume/Brightness) — `l` flag = works even when locked
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# ─────────────────────────────────────────────────────────────────────────
# 💻 CORE APPLICATIONS (with J.A.R.V.I.S. sounds)
# ─────────────────────────────────────────────────────────────────────────
bind=SUPER,Return,spawn,sh -c "/usr/local/bin/sound-system open-terminal && ghostty"
bind=SUPER+SHIFT,Return,spawn,kitty
bind=SUPER,b,spawn,sh -c "/usr/local/bin/sound-system launch-firefox && firefox"
bind=SUPER+SHIFT,b,spawn,sh -c "/usr/local/bin/sound-system launch-brave && brave"
bind=SUPER,e,spawn,sh -c "/usr/local/bin/sound-system open-files && dolphin"
bind=SUPER+SHIFT,d,spawn,rofi -show drun
bind=SUPER+SHIFT,t,spawn,sh -c "/usr/local/bin/sound-system launch-kate && kate"
bind=SUPER,o,spawn,sh -c "/usr/local/bin/sound-system launch-obs && obs"
bind=SUPER,p,spawn,sh -c "/usr/local/bin/sound-system launch-spotify && spotify-launcher"


# ─────────────────────────────────────────────────────────────────────────
# 🌐 WEBAPPS (Mod+Ctrl) - No sounds for quick web app access
# ─────────────────────────────────────────────────────────────────────────
bind=SUPER+CTRL,y,spawn,brave --app=https://youtube.com --profile-directory='YouTube'
bind=SUPER+CTRL,t,spawn,brave --app=https://twitch.tv --profile-directory='Twitch'
bind=SUPER+CTRL,s,spawn,brave --app=https://open.spotify.com --profile-directory='Spotify'
bind=SUPER+CTRL,d,spawn,brave --app=https://discord.com/app --profile-directory='Discord'

# ─────────────────────────────────────────────────────────────────────────
# 🎮 GAMING & PERFORMANCE
# ─────────────────────────────────────────────────────────────────────────
bind=SUPER,g,spawn,/usr/local/bin/sound-system gaming-toggle
bind=SUPER+SHIFT,s,spawn,sh -c "/usr/local/bin/sound-system steam-launch && steam"

# ─────────────────────────────────────────────────────────────────────────
# ⚡ WEHTTAMSNAPS SPECIFIC
# ─────────────────────────────────────────────────────────────────────────
bind=SUPER,h,spawn,~/.config/wehttamsnaps/scripts/keyhints.sh
bind=SUPER+SHIFT,w,spawn,workmode
bind=SUPER+SHIFT,g,spawn,gamemode
bind=SUPER,slash,spawn,/usr/local/bin/jarvis-menu command
bind=SUPER+ALT,j,spawn,/usr/local/bin/jarvis-menu
bind=SUPER+ALT,g,spawn,python3 /home/wehttamsnaps/.config/wehttamsnaps/scripts/game-launcher.py

# ─────────────────────────────────────────────────────────────────────────
# 📐 TAG SWITCHING (Mod + 1-9, Mod + 0 for overview)
# ─────────────────────────────────────────────────────────────────────────
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,0

# Move focused window to tag
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
# No tag 10 to move to. Repurposed as "pin window to ALL tags" (toggletag 0),
# the closest thing Mango doesn't even have — a handy bonus key.
bind=SUPER+SHIFT,0,toggletag,0

# Tag navigation
bind=SUPER,Tab,viewtoright
bind=SUPER+ALT,Left,viewtoleft
bind=SUPER+ALT,Right,viewtoright

# ─────────────────────────────────────────────────────────────────────────
# 🪟 WINDOW MANAGEMENT
# ─────────────────────────────────────────────────────────────────────────
bind=SUPER,q,spawn,sh -c "/usr/local/bin/sound-system window-close && mmsg dispatch killclient"

bind=SUPER,d,togglemaximizescreen
bind=SUPER,f,togglefullscreen
bind=SUPER,a,togglefloating

# Focus (arrow keys + vim keys)
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

# Move/swap windows (niri's "move-column"/"move-window" -> mango's exchange_client)
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Right,exchange_client,right
bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,j,exchange_client,down
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,l,exchange_client,right

# NOTE: niri's focus-column-first/last and move-column-to-first/last have no
# direct mango dispatcher. Closest approximation is cycling the stack:
bind=SUPER,Home,focusstack,prev
bind=SUPER,End,focusstack,next

# Monitor focus
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Down,focusmon,down
bind=SUPER+SHIFT,Up,focusmon,up
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,h,focusmon,left
bind=SUPER+SHIFT,j,focusmon,down
bind=SUPER+SHIFT,k,focusmon,up
bind=SUPER+SHIFT,l,focusmon,right

# Move focused window to another monitor (keeptag=1 keeps the same tag number)
bind=SUPER+SHIFT+CTRL,Left,tagmon,left,1
bind=SUPER+SHIFT+CTRL,Down,tagmon,down,1
bind=SUPER+SHIFT+CTRL,Up,tagmon,up,1
bind=SUPER+SHIFT+CTRL,Right,tagmon,right,1
bind=SUPER+SHIFT+CTRL,h,tagmon,left,1
bind=SUPER+SHIFT+CTRL,j,tagmon,down,1
bind=SUPER+SHIFT+CTRL,k,tagmon,up,1
bind=SUPER+SHIFT+CTRL,l,tagmon,right,1

# Tag up/down (Page keys + U/I)
bind=SUPER,Page_Down,viewtoright
bind=SUPER,Page_Up,viewtoleft
bind=SUPER,u,viewtoright
bind=SUPER,i,viewtoleft
bind=SUPER+CTRL,Page_Down,tagtoright
bind=SUPER+CTRL,Page_Up,tagtoleft
bind=SUPER+CTRL,u,tagtoright
bind=SUPER+CTRL,i,tagtoleft

# NOTE: niri's move-workspace-up/down REORDERS workspaces themselves — mango
# tags have fixed numeric identity, so there's nothing to reorder. These four
# keys (Mod+Shift+Page_Down/Up/U/I) have no mango equivalent and are dropped.

# NOTE: niri's Mod+WheelScroll* bindings drove workspace/column navigation
# straight from a keybind. mango handles the mouse wheel through a separate
# "mouse gestures" config block, not the `bind=` keyboard syntax used here —
# see NOTES.md for where to pick this back up.

# ─────────────────────────────────────────────────────────────────────────
# 📸 SCREENSHOTS
# ─────────────────────────────────────────────────────────────────────────
# Screenshots
bind=NONE,F10,spawn,$HOME/.config/mango/scripts/screenshot.sh fullscreen
bind=SHIFT,F10,spawn,$HOME/.config/mango/scripts/screenshot.sh region
bind=CTRL+SHIFT,F10,spawn,$HOME/.config/mango/scripts/screenshot.sh window
bind=CTRL+SUPER,F10,spawn,$HOME/.config/mango/scripts/screenshot.sh freeze
bind=SHIFT+SUPER,F10,spawn,$HOME/.config/mango/scripts/screenshot.sh freeze-region
bind=SUPER,F10,spawn,$HOME/.config/mango/scripts/screenshot.sh annotate
# ─────────────────────────────────────────────────────────────────────────
# 🎵 AUDIO CONTROLS (with J.A.R.V.I.S. feedback) — commented like the original
