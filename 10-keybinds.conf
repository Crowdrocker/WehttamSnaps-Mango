# bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# ─────────────────────────────────────────────────────────────────────────
# ⚙️ SYSTEM
# ─────────────────────────────────────────────────────────────────────────
bind=SUPER+SHIFT+CTRL,p,spawn,systemctl poweroff

# NOTE: niri's built-in "show-hotkey-overlay" has no mango equivalent — your
# existing Mod+H keyhints.sh rofi cheat-sheet already covers this, so nothing
# is lost.

bind=SUPER+ALT,l,spawn,sh -c "/usr/local/bin/sound-system locking-screen && lock-session"
bind=SUPER+SHIFT,r,spawn,sh -c "mmsg dispatch reload_config && /usr/local/bin/sound-system config-reload"
