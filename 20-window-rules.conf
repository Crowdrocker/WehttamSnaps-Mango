# ═══════════════════════════════════════════════════════════════════════════════
# 20 — WINDOW RULES
# Converted from niri's `window-rule { match ...; property value; }` blocks to
# mango's single-line `windowrule=Param:Value,Param:Value,appid:regex,title:regex`.
# Multiple `match app-id=...` lines inside one niri rule become one regex
# alternation here, e.g. `^(a|b|c)$`.
#
# THINGS THAT DID NOT CARRY OVER (see NOTES.md for details):
#   - geometry-corner-radius (per-app radius) -> mango only has ONE global
#     border_radius (set in 80-layout-and-monitors.conf). isnoradius:1 can
#     opt a window OUT of the radius, but not set a custom one.
#   - default-floating-position "relative-to" a screen corner -> approximated
#     with offsetx/offsety (relative to center), not pixel-exact.
#   - block-out-from "screencast" -> no equivalent windowrule parameter exists
#     in mango yet, so KeePassXC/Gnome Secrets and the welcome app are NOT
#     hidden from screen shares/recordings like they were in niri.
#   - is-window-cast-target=true (red border while being screen-shared) ->
#     no equivalent match condition exists.
#   - custom per-app border/focus-ring gradients (MO2's pink/blue, the
#     cast-target red, the generic webapp blue) -> mango borders are solid
#     colors only, and only globally (no per-rule border color parameter).
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# FLOATING WINDOWS
# ═══════════════════════════════════════════════════════════════════════════════
windowrule=isfloating:1,appid:^qpwgraph$

# ─── File Pickers & Dialogs ───
windowrule=isfloating:1,appid:^xdg-desktop-portal-gtk$
windowrule=isfloating:1,title:^(File Upload|Save As|Open Files)$
windowrule=isfloating:1,appid:^firefox$,title:^Extension

# ═══════════════════════════════════════════════════════════════════════════════
# === STEAMTINKERLAUNCH (STL) ===
# ═══════════════════════════════════════════════════════════════════════════════
windowrule=isfloating:1,width:1400,height:900,appid:^steamtinkerlaunch$,title:^SteamTinkerLaunch
windowrule=isfloating:1,width:800,height:600,appid:^steamtinkerlaunch$,title:^SteamTinkerLaunch.*Terminal
windowrule=isfloating:1,width:1000,height:700,appid:^steamtinkerlaunch$,title:^SteamTinkerLaunch.*Config
# This one was NOT floating in niri (tiled, 80% width) — same here.
windowrule=isfloating:0,width:0.8,appid:^steamtinkerlaunch$,title:^SteamTinkerLaunch.*Launch

# === VORTEX MOD MANAGER ===
windowrule=isfloating:1,width:1600,height:1000,appid:^vortex$,title:^Vortex
windowrule=isfloating:1,width:800,height:600,appid:^vortex$,title:^Vortex.*Select.*Game
windowrule=isfloating:1,width:1200,height:800,appid:^vortex$,title:^Vortex.*Plugin$|^Vortex.*Mod
windowrule=isfloating:1,width:1000,height:700,appid:^vortex$,title:^Vortex.*Deployment$|^Vortex.*Log

# ═══════════════════════════════════════════════════════════════════════════════
# === MOD ORGANIZER 2 ===
# ═══════════════════════════════════════════════════════════════════════════════
# These were TILED (open-maximized) in niri, not floating — force_tiled_state
# keeps them well-behaved in mango's tiling layouts.
windowrule=force_tiled_state:1,appid:^(modorganizer2|mo2)$,title:^Mod Organizer
windowrule=force_tiled_state:1,appid:^(modorganizer2|mo2)$,title:^Mod Organizer.*Mod List
windowrule=isfloating:1,width:1100,height:750,appid:^(modorganizer2|mo2)$,title:^Mod Organizer.*Plugin
windowrule=isfloating:1,width:1000,height:700,appid:^(modorganizer2|mo2)$,title:^Mod Organizer.*Archive
windowrule=isfloating:1,width:900,height:650,appid:^(modorganizer2|mo2)$,title:^Mod Organizer.*Executables

# === WABBAJACK ===
windowrule=force_tiled_state:1,appid:^wabbajack$,title:^Wabbajack
windowrule=isfloating:1,width:1000,height:600,appid:^wabbajack$,title:^Wabbajack.*Download$|^Wabbajack.*Progress
windowrule=isfloating:1,width:1200,height:800,appid:^wabbajack$,title:^Wabbajack.*Select$|^Wabbajack.*Choose
windowrule=isfloating:1,width:1100,height:750,appid:^wabbajack$,title:^Wabbajack.*Log$|^Wabbajack.*Console

# ═══════════════════════════════════════════════════════════════════════════════
# === GENERAL MODDING TOOLS ===
# ═══════════════════════════════════════════════════════════════════════════════
windowrule=isfloating:1,width:1200,height:800,appid:^(nexusmodmanager|nmm)$,title:^Nexus Mod Manager
windowrule=isfloating:1,width:1300,height:850,appid:^loot$,title:^LOOT
windowrule=isfloating:1,width:1400,height:900,appid:^(xedit|tesedit|foedit|sseedit)$,title:^xEdit$|^TESVEdit$|^FO4Edit$|^SSEEdit$
windowrule=isfloating:1,width:1600,height:1000,appid:^(creationkit|ck64)$,title:^Creation Kit
windowrule=isfloating:1,width:1400,height:900,appid:^(bodyslide|outfitstudio)$,title:^BodySlide$|^Outfit Studio
windowrule=isfloating:1,width:900,height:650,appid:^(fnis|nemesis)$,title:^FNIS$|^GenerateFNISForMod$|^Nemesis

# ═══════════════════════════════════════════════════════════════════════════════
# === MODDING FILE MANAGERS / ARCHIVE TOOLS ===
# ═══════════════════════════════════════════════════════════════════════════════
windowrule=isfloating:1,width:800,height:600,appid:^winetricks$,title:^winetricks
windowrule=isfloating:1,width:700,height:550,appid:^winecfg$,title:^Wine configuration
windowrule=isfloating:1,width:900,height:650,appid:^(p7zip|ark|file-roller)$,title:^Archive|^7-Zip|^ark

# ═══════════════════════════════════════════════════════════════════════════════
# === MODDING WEB TOOLS ===
# ═══════════════════════════════════════════════════════════════════════════════
windowrule=isfloating:1,width:1400,height:900,appid:^nexusmods-webapp$
windowrule=isfloating:1,width:1300,height:850,appid:^loot-webapp$

# ═══════════════════════════════════════════════════════════════════════════════
# === MODDING TERMINALS ===
# ═══════════════════════════════════════════════════════════════════════════════
windowrule=isfloating:1,width:1000,height:700,title:^(modding|stl|vortex|mo2)

# ═══════════════════════════════════════════════════════════════════════════════
# TERMINAL (was open-floating false, i.e. tiled — same intent here)
# ═══════════════════════════════════════════════════════════════════════════════
windowrule=force_tiled_state:1,appid:^(com\.mitchellh\.ghostty|kitty|alacritty)$

# Swallow: launching a GUI app from ghostty/kitty replaces the terminal
# window with it, and the terminal comes back when the app closes. Purely
# additive — niri never had this. If a specific app gets annoying to have
# swallow your terminal (e.g. something you want to keep the terminal
# visible alongside), add a line like:
#   windowrule=noswallow:1,appid:some-app-id
windowrule=isterm:1,appid:^(com\.mitchellh\.ghostty|kitty)$

# Translucent terminals. Flat see-through (no blur behind it) since global
# blur is off — the "frosted glass" look needs `blur=1` in
# 80-layout-and-monitors.conf too, which is currently disabled to match your
# old niri look. Turn that on if you want the terminals to actually blur
# what's behind them instead of just fading it.
windowrule=focused_opacity:0.92,unfocused_opacity:0.85,appid:^(com\.mitchellh\.ghostty|kitty)$

# ═══════════════════════════════════════════════════════════════════════════════
# Picture-in-Picture always floats
# ═══════════════════════════════════════════════════════════════════════════════
windowrule=isfloating:1,width:800,height:600,title:Picture-in-Picture

# ═══════════════════════════════════════════════════════════════════════════════
# UTILITY WINDOWS
# ═══════════════════════════════════════════════════════════════════════════════
windowrule=isfloating:1,width:800,height:600,appid:^(gnome-calculator|galculator|blueman-manager|pavucontrol|nm-connection-editor|helvum)$
windowrule=isfloating:1,width:800,height:600,title:^KeyHints$

# Settings windows
windowrule=isfloating:1,width:800,height:600,appid:^(gnome-control-center|nwg-look|nwg-displays|nwg-drawer|lxappearance)$

# ═══════════════════════════════════════════════════════════════════════════════
# ZOOM
# ═══════════════════════════════════════════════════════════════════════════════
windowrule=isfloating:1,appid:^zoom$

# ═══════════════════════════════════════════════════════════════════════════════
# Generic webapp rule (catches all webapps, e.g. *-webapp desktop entries)
# ═══════════════════════════════════════════════════════════════════════════════
windowrule=isfloating:1,width:1300,height:850,appid:.*-webapp$

# ═══════════════════════════════════════════════════════════════════════════════
# GAMING
# ═══════════════════════════════════════════════════════════════════════════════
# Catch almost all Wine/Proton game processes before they land in a tile.
# force_tearing:1 here covers every Steam/Proton game broadly (on top of the
# named-game rules with the same flag in 30-tags.conf, and the global
# allow_tearing=2 fullscreen-only default in 80-layout-and-monitors.conf).
windowrule=isfloating:1,force_tearing:1,appid:^steam_app_.*$
# vkcube is the standard tearing test tool — run it and look for a visible
# tear line while moving the cube if you want to confirm tearing is active.
windowrule=force_tearing:1,title:^vkcube$
windowrule=isfloating:1,title:^(EA|Origin)$
windowrule=isfloating:1,appid:^com\.heroicgameslauncher\.hgl$
windowrule=isfloating:1,title:^Heroic Games Launcher$
windowrule=isfloating:1,title:^Rockstar Games Launcher$
windowrule=isfloating:1,title:^Battle\.net$
windowrule=isfloating:1,title:^Riot Client$
# Total fallback: catch raw unmanaged Wine windows
windowrule=isfloating:1,title:^Wine.*$
windowrule=isfloating:1,title:^Ubisoft Connect$
windowrule=isfloating:1,appid:^protonup-qt$

# ═══════════════════════════════════════════════════════════════════════════════
# === WELCOME APP ===
# ═══════════════════════════════════════════════════════════════════════════════
# NOTE: niri's `block-out-from "screencast"` on this rule has no mango
# equivalent — the welcome screen WILL be visible in screen shares/recordings.
windowrule=isfloating:1,appid:^(python3|python)$,title:^Welcome to WehttamSnaps$
windowrule=isfloating:1,width:800,height:600,title:^J\.A\.R\.V\.I\.S\. Command Protocols

# ═══════════════════════════════════════════════════════════════════════════════
# SCREEN SHARING / SCREEN RECORDING
# ═══════════════════════════════════════════════════════════════════════════════
windowrule=isfloating:1,appid:^xdg-desktop-portal-wlr$

# ═══════════════════════════════════════════════════════════════════════════════
# Noctalia Shell / Quickshell
# ═══════════════════════════════════════════════════════════════════════════════
windowrule=isfloating:1,appid:^(qs|quickshell)$

# ═══════════════════════════════════════════════════════════════════════════════
# EXCLUDED FROM SCREENSHOTS — unsupported, see header note. Left as reference:
# ═══════════════════════════════════════════════════════════════════════════════
# windowrule=???,appid:some-sensitive-app   <- no block-out-from equivalent
