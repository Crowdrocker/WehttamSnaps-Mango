# ═══════════════════════════════════════════════════════════════════════════════
# 50 — ANIMATIONS
# niri uses spring-physics (damping-ratio/stiffness) and per-action curves;
# mango uses fixed durations (ms) + cubic-bezier curves + zoom ratios. There's
# no true 1:1 conversion, so these are tuned to *feel* similar to your
# cyberpunk-smooth niri setup (snappy opens, bouncier tag switches) rather
# than matching the physics exactly.
# ═══════════════════════════════════════════════════════════════════════════════

animations=1
layer_animations=1

# Open = quick zoom-in (was window-open: ease-out-expo, 150ms)
animation_type_open=zoom
animation_duration_open=150
animation_curve_open=0.16,1.0,0.3,1.0
zoom_initial_ratio=0.92
zoom_end_ratio=1.0

# Close = fast fade (was window-close: ease-out-quad, 150ms)
animation_type_close=fade
animation_duration_close=150
animation_curve_close=0.25,0.46,0.45,0.94

# Window move (was window-movement spring, damping 0.75 / stiffness 323 -> soft bounce)
animation_duration_move=280
animation_curve_move=0.34,1.35,0.64,1.0

# Tag switching (was horizontal-view-movement spring, damping 0.85 / stiffness 423)
animation_duration_tag=220
animation_curve_tag=0.22,1.0,0.36,1.0
tag_animation_direction=1

# Focus change fade (niri didn't animate this explicitly; keep it snappy/off)
animation_duration_focus=0

# Fade-in/out opacity behaviour used by the fade close animation above
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.5

# Layer surfaces (bars, launchers, notifications) — was your niri
# config-notification-open-close / screenshot-ui-open animations
layer_animation_type_open=slide
layer_animation_type_close=fade

# NOTE: niri's overview-open-close spring and per-preset comment block
# (Gaming/Cinematic/Minimal/Instant) have no equivalent "presets" system in
# mango — if you want a snappier "gaming mode", the fastest path is swapping
# these numbers via `setoption` in a keybind, or keeping a second sourced
# file (e.g. 50-animations-gaming.conf) and re-sourcing config.conf.
