#
# MangoWC Configuration : Input Devices Configuration ------
#
# Configure keyboard layouts, mouse sensitivity, and touchpad gestures.
#
# ----------------------------------------------------------

# Keyboard Settings
# Control key repeat rates and layout rules.
repeat_rate=25
repeat_delay=600
numlockon=0
#xkb_rules_rules=
#xkb_rules_model=
xkb_rules_layout=us
#xkb_rules_variant=dvorak
#xkb_rules_options=caps:escape

# Trackpad Settings
# Specific settings for laptop touchpads.
# Note: Some settings may require a relogin to take effect.
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
trackpad_natural_scrolling=0
#scroll_button=274
scroll_method=1
click_method=1
drag_lock=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# Mouse Settings
# Configuration for external mice.
mouse_natural_scrolling=0
accel_profile=2
accel_speed=0.0
left_handed=0
middle_button_emulation=0
swipe_min_threshold=20
send_events_mode=0
button_map=0

