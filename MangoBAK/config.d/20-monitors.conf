# MangoWC Configuration : Monitors Configuration -----------
#
# Manage display outputs, resolution, scaling, and tearing.
#
# ----------------------------------------------------------

# Monitor Rules
# You can configure each display output individually using the monitorrule keyword.
# Syntax: monitorrule=name:Values,Parameter:Values,Parameter:Values

# HiDPI Laptop Display
#monitorrule=name:eDP-1,width:2944,height:1840,refresh:90,x:0,y:0,scale:1.5,rr:0,vrr:0

# FHD Laptop Display
#monitorrule=name:eDP-1,width:1920,height:1080,refresh:60,x:0,y:0,scale:1.5,rr:0,vrr:0

# Monitor Display
#monitorrule=name:HDMI-A-1,width:1920,height:1080,refresh:60,x:0,y:0,scale:1,rr:0,vrr:0
# More option see https://github.com/DreamMaoMao/mango/wiki/
## monitorrule=name:DP-2,width:1920,height:1080,refresh:60,x:0,y:0,scale:1
## monitorrule=name:DP-1,width:1920,height:1080,refresh:60,x:1920,y:0,scale:1
# Monitor display: 1080p, 60Hz, positioned at origin
## monitorrule=name:^DP-2$,width:1920,height:1080,refresh:60,x:0,y:,scale:1
## monitorrule=name:^DP-1$,width:1920,height:1080,refresh:60,x:1920,y:,scale:1
# ----------------------------------------------------------

# Tearing (Game Mode)
# Tearing allows games to bypass the compositor's VSync for lower latency
# Global tearing control: 0 (Disable), 1 (Enable), 2 (Fullscreen only)
allow_tearing=1

# Enable per Window: Use a window rule to force tearing for specific games.
# Ex: windowrule=force_tearing:1,title:vkcube

# Graphics Card Compatibility
# Some graphics cards require setting the WLR_DRM_NO_ATOMIC environment variable before mango starts to successfully enable tearing.
# Add this to /etc/environment and reboot: WLR_DRM_NO_ATOMIC=1

# ─── MONITOR ALIGNMENT ────────────────────────────────────────────────────────
# Configure resolutions and placement (adjust coordinates/refresh rates to match wlr-randr)
monitorrule=name:DP-2,width:1920,height:1080,refresh:60,x:0,y:0,scale:1       # Left 4K Main Monitor
monitorrule=name:DP-1,width:1920,height:1080,refresh:60,x:1920,y:0,scale:1   # Right Secondary Monitor

# ─── PRIMARY MONITOR WORKSPACES (DP-2) ────────────────────────────────────────
# Assign tags 1 through 5 strictly to the left monitor
tagrule = monitor:DP-2, 1
tagrule = monitor:DP-2, 2
tagrule = monitor:DP-2, 3
tagrule = monitor:DP-2, 4
tagrule = monitor:DP-2, 5

# Force the "Gaming" and "Media/Photo" tags into Niri-style horizontal scrolling
tagrule = layout:scroller, 3
tagrule = layout:scroller, 4
tagrule = layout:scroller, 5

# ─── SECONDARY MONITOR WORKSPACES (DP-1) ──────────────────────────────────────
# Assign tags 6 through 11 strictly to the right monitor
tagrule = monitor:DP-1, 6
tagrule = monitor:DP-1, 7
tagrule = monitor:DP-1, 8
tagrule = monitor:DP-1, 9
tagrule = monitor:DP-1, 10
tagrule = monitor:DP-1, 11

# Force communications and file managers to use a traditional clean grid or tile layout
tagrule = layout:grid, 7   # Comm / Discord
tagrule = layout:tile, 9   # Files


# --- Primary Monitor Rules (DP-2) ---
windowrule = tag:1, ^(firefox|chromium|Brave-browser)$  # Browser
windowrule = tag:2, ^(foot|kitty|ghostly|alacritty)$             # Term
windowrule = tag:3, ^steam_app_.*$                       # Gaming (Your division 2 fix)
windowrule = tag:4, ^(gimp-.*|darktable)$               # Photo

# --- Secondary Monitor Rules (DP-1) ---
windowrule = tag:6, ^(obs)$                              # Stream
windowrule = tag:7, ^(discord|vesktop|element)$          # Comm
windowrule = tag:8, ^(spotify|com\.spotify\.Client)$     # Music
windowrule = tag:9, ^(org\.gnome\.Dolphin|thunar)$      # Files
windowrule = tag:11, ^(Ubisoft Connect|Lutris)$          # Leu (Launchers)
