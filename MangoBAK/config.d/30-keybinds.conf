# ---

# Media keys
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# Screenshots
bindl = NONE,       F10, spawn, ~/.config/mango/scripts/screenshot --now
bindl = NONE+ALT,   F10, spawn, ~/.config/mango/scripts/screenshot --in5
bindl = NONE+SHIFT, F10, spawn, ~/.config/mango/scripts/screenshot --in10
bind  = NONE+CTRL,  F10, spawn, ~/.config/mango/scripts/screenshot --win
bind  = SUPER,      F10, spawn, ~/.config/mango/scripts/screenshot --area

# ---

# Window
bind = SUPER,       C,      killclient
bind = SUPER,       Q,      killclient 
bind = SUPER,       A,      togglefloating
bind = SUPER,       F,      togglefullscreen
bind = SUPER,       Z,      zoom
bind = SUPER+SHIFT, Z,      focuslast
bind = SUPER+SHIFT, C,      centerwin
bind = SUPER,       G,      toggleglobal,
bind = SUPER,       O,      toggleoverlay,
bind = ALT,         Tab,    toggleoverview,
bind = ALT,         a,      togglemaximizescreen,
bind = SUPER+SHIFT, B,      toggle_render_border,
bind = SUPER+SHIFT, R,      reload_config
bind = CTRL+ALT,    Delete, quit

# ---

# Switch Window Focus
bind = SUPER,       Left,  focusdir, left
bind = SUPER,       Right, focusdir, right
bind = SUPER,       Up,    focusdir, up
bind = SUPER,       Down,  focusdir, down
bind = SUPER,       Tab,   focusstack, next
bind = SUPER+SHIFT, Tab,   exchange_stack_client, next

# Swap Window
bind = SUPER+SHIFT, Left,  exchange_client, left
bind = SUPER+SHIFT, Right, exchange_client, right
bind = SUPER+SHIFT, Up,    exchange_client, up
bind = SUPER+SHIFT, Down,  exchange_client, down

# Resize Active
bind = SUPER+CTRL, Left,  resizewin, -50, +0
bind = SUPER+CTRL, Right, resizewin, +50, +0
bind = SUPER+CTRL, Up,    resizewin, +0, -50
bind = SUPER+CTRL, Down,  resizewin, +0, +50

# Move Active (Floating Only)
bind = SUPER+ALT, Left,   movewin, -50, +0
bind = SUPER+ALT, Right,  movewin, +50, +0
bind = SUPER+ALT, Up,     movewin, +0, -50
bind = SUPER+ALT, Down,   movewin, +0, +50

# Smart Move/Resize (floating only)
bind = SUPER+ALT, A, smartmovewin,left
bind = SUPER+ALT, D, smartmovewin,right
bind = SUPER+ALT, W, smartmovewin,up
bind = SUPER+ALT, S, smartmovewin,down
bind = SUPER+CTRL, A, smartresizewin,left
bind = SUPER+CTRL, D, smartresizewin,right
bind = SUPER+CTRL, W, smartresizewin,up
bind = SUPER+CTRL, S, smartresizewin,down

# ---

# Tag Switch
bind = SUPER, 1, view, 1,0
bind = SUPER, 2, view, 2,0
bind = SUPER, 3, view, 3,0
bind = SUPER, 4, view, 4,0
bind = SUPER, 5, view, 5,0
bind = SUPER, 6, view, 6,0
bind = SUPER, 7, view, 7,0
bind = SUPER, 8, view, 8,0
bind = SUPER, 9, view, 9,0

# Move client to the tag
# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
bind = SUPER+SHIFT, 1, tag, 1,0
bind = SUPER+SHIFT, 2, tag, 2,0
bind = SUPER+SHIFT, 3, tag, 3,0
bind = SUPER+SHIFT, 4, tag, 4,0
bind = SUPER+SHIFT, 5, tag, 5,0
bind = SUPER+SHIFT, 6, tag, 6,0
bind = SUPER+SHIFT, 7, tag, 7,0
bind = SUPER+SHIFT, 8, tag, 8,0
bind = SUPER+SHIFT, 9, tagsilent, 9,0

# Scratchpad 
bind = SUPER,       I, minimized,
bind = SUPER+SHIFT, I, restore_minimized
bind = SUPER,       0, toggle_scratchpad

# Seamless Tag Switching
bind = CTRL+ALT,       Left,  viewtoleft_have_client,0
bind = CTRL+ALT,       Right, viewtoright_have_client,0
bind = CTRL+ALT+SHIFT, Left,  tagtoleft,0
bind = CTRL+ALT+SHIFT, Right, tagtoright,0

# ---

# Scroller Layout
bind = ALT, E, set_proportion,1.0
bind = ALT, X, switch_proportion_preset,

# Switch Layout
bind = SUPER,       L, switch_layout
bind = SUPER+SHIFT, L, setlayout,scroller

# ---

# Monitor Switch
bind = SUPER+CTRL+SHIFT, Left,  focusmon, left
bind = SUPER+CTRL+SHIFT, Right, focusmon, right
bind = SUPER+ALT+SHIFT, Left,  tagmon,   left
bind = SUPER+ALT+SHIFT, Right, tagmon,   right

# ---

# Gaps
bind = SUPER+SHIFT, minus, incgaps,1
bind = SUPER+SHIFT, equal, incgaps,-1
bind = SUPER+SHIFT, G, togglegaps

# ---

# Virutal Monitor
bind = SUPER,       V, create_virtual_output
bind = SUPER+SHIFT, V, destroy_all_virtual_output
