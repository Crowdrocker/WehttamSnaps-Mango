# MangoWC Configuration : Key Bindings Configuration -------
#
# Define keyboard shortcuts and modes.
#
# ----------------------------------------------------------

# Key bindings follow this format:
# bind[flags]=MODIFIERS,KEY,COMMAND,PARAMETERS
#
# Modifiers: SUPER, CTRL, ALT, SHIFT, NONE (combine with +).
# Key: Key name (from xev or wev) or code (e.g., code:24 for q).
#
# Flags -
# l: Works even when screen is locked.
# s: Uses keysym instead of keycode.
# r: Triggers on key release instead of press.
# p: Pass key event to client.

# Core binds
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER, s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle

# ─────────────────────────────────────────────────────────────────────────────
# 💻 CORE APPLICATIONS (with J.A.R.V.I.S. sounds)
# ─────────────────────────────────────────────────────────────────────────────
# Terminal - Super+Return (Ghostty)
bind=SUPER, Return,spawn,sh -c "sound-system open-terminal && ghostty"

# Terminal - Super+Shift+Return (Kitty)
# bind=SUPER+SHIFT,Return,spawn,kitty

# Browser - Super+B (Brave)
# bind=SUPER,b,spawn,sh -c "sound-system launch-brave && brave"

# Browser - Super+Shift+B (Firefox)
bind=SUPER+SHIFT,w,spawn,sh -c "sound-system launch-firefox && firefox"

# File Manager - Super+E (Dolphin)
bind = SUPER+SHIFT, F,spawn,sh -c "sound-system open-files && dolphin"

# App Launcher - Super+Shift+D (Rofi)
# bind=SUPER+SHIFT,d,spawn,rofi -show drun

# Text Editor - Super+Shift+T (Kate)
bind = SUPER+SHIFT, E,spawn,sh -c "sound-system launch-kate && kate"

# OBS Studio - Super+O
bind=SUPER, O,spawn,sh -c "sound-system launch-obs && obs"

# Spotify - Super+P
bind=SUPER, P,spawn,sh -c "sound-system launch-spotify && spotify-launcher"

# ─────────────────────────────────────────────────────────────────────────────
# 🌐 WEBAPPS (Super+Ctrl)
# ─────────────────────────────────────────────────────────────────────────────
bind=SUPER+CTRL, Y,spawn,brave --app=https://youtube.com --profile-directory=YouTube
bind=SUPER+CTRL, T,spawn,brave --app=https://twitch.tv --profile-directory=Twitch
bind=SUPER+CTRL, S,spawn,brave --app=https://open.spotify.com --profile-directory=Spotify
bind=SUPER+CTRL,  D,spawn,brave --app=https://discord.com/app --profile-directory=Discord

# ─────────────────────────────────────────────────────────────────────────────
# 🎮 GAMING & PERFORMANCE
# ─────────────────────────────────────────────────────────────────────────────
# Gaming Mode Toggle - Super+G
bind=SUPER, G,spawn,/usr/local/bin/sound-system gaming-toggle

# Steam Launch - Super+Shift+S
bind=SUPER+SHIFT, S,spawn,sh -c "sound-system steam-launch && steam"

# ─────────────────────────────────────────────────────────────────────────────
# ⚡ WEHTTAMSNAPS SPECIFIC
# ─────────────────────────────────────────────────────────────────────────────
# KeyHints cheat sheet
bind=SUPER, H,spawn,sh -c "~/.config/wehttamsnaps/scripts/keyhints.sh"

# Work Mode (Purple / J.A.R.V.I.S.)
bind=SUPER+SHIFT, W,spawn,workmode

# Game Mode (Cyan / iDroid)
bind=SUPER+SHIFT, G,spawn,gamemode

# J.A.R.V.I.S. menus
bind=SUPER, slash,spawn,/usr/local/bin/jarvis-menu command
bind=SUPER+ALT, J,spawn,/usr/local/bin/jarvis-menu

# Open game launcher
bind=SUPER+ALT, G,spawn,python3 /home/wehttamsnaps/.config/wehttamsnaps/scripts/game-launcher.py
