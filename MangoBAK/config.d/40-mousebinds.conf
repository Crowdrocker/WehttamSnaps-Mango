# MangoWC Configuration : Mouse Bindings Configuration -----
#
# Configure mouse buttons, scrolling.
#
# ----------------------------------------------------------

# Mouse Button
# Assign actions to mouse button presses with optional modifier keys.
# Syntax: mousebind=MODIFIERS,BUTTON,COMMAND,PARAMETERS
#
# Modifiers: SUPER, CTRL, ALT, SHIFT, NONE. Combine with + (e.g., SUPER+CTRL)
# Buttons: btn_left, btn_right, btn_middle, btn_side, btn_extra, btn_forward, btn_back, btn_task
# When modifiers are set to NONE: Only btn_middle works in normal mode, btn_left and btn_right only work in overview mode
mousebind = SUPER, btn_left,   moveresize,curmove
mousebind = NONE,  btn_middle, togglemaximizescreen,0
mousebind = SUPER, btn_right,  moveresize,curresize
mousebind = NONE,  btn_left,   toggleoverview,1
mousebind = NONE,  btn_right,  killclient,0

# ----------------------------------------------------------

# Axis Bindings
# Map scroll wheel movements to actions for workspace and window navigation.
# Syntax: axisbind=MODIFIERS,DIRECTION,COMMAND,PARAMETERS
#
# Direction: UP, DOWN, LEFT, RIGHT
axisbind = SUPER, UP,   viewtoleft_have_client
axisbind = SUPER, DOWN, viewtoright_have_client
