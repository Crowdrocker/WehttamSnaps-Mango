# MangoWC Configuration : Hypridle -------------------------

# General
general {
    lock_cmd = pidof hyprlock || hyprlock --config ~/.config/mango/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = mmsg -d enable_monitor eDP-1
}

# Set monitor backlight to minimum, avoid 0 on OLED monitor
listener {
    timeout = 120
    on-timeout = light -O && light -S 5
    on-resume = light -I
}

# Turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener { 
    timeout = 120
    on-timeout = light -s sysfs/leds/platform::kbd_backlight -O && light -s sysfs/leds/platform::kbd_backlight -S 0
    on-resume = light -s sysfs/leds/platform::kbd_backlight -I
}

# Lock screen when timeout has passed
listener {
    timeout = 240
    on-timeout = loginctl lock-session
}

# Screen off when timeout has passed
listener {
    timeout = 360
    on-timeout = mmsg -d disable_monitor eDP-1
    on-resume = mmsg -d enable_monitor eDP-1
}

# Suspend PC
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
