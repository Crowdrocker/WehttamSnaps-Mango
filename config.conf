# ═══════════════════════════════════════════════════════════════════════════════
# WEHTTAMSNAPS MANGOWM CONFIGURATION
# Converted from the niri config by Matthew (WehttamSnaps)
# ═══════════════════════════════════════════════════════════════════════════════
# mangowm reads one config.conf but lets you split it up with `source=`.
# This mirrors the numbered-file layout of your old niri config so it's easy
# to find your way around. Load order matters a little (env vars first,
# binds/rules can come in any order) so keep this order.
#
# Put this whole folder at: ~/.config/mango/
# Validate anytime with:    mango -c ~/.config/mango/config.conf -p
# Hot-reload after edits:   Mod+Shift+R (bound in 10-keybinds.conf)
# ═══════════════════════════════════════════════════════════════════════════════

source=~/.config/mango/70-environment.conf
source=~/.config/mango/80-layout-and-monitors.conf
source=~/.config/mango/50-animations.conf
source=~/.config/mango/40-startup.conf
source=~/.config/mango/10-keybinds.conf
source=~/.config/mango/20-window-rules.conf
source=~/.config/mango/30-tags.conf
source=~/.config/mango/60-layer-rules.conf
source=~/.config/mango/90-user-extra.conf
