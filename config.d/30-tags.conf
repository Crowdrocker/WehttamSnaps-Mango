# ═══════════════════════════════════════════════════════════════════════════════
# 30 — TAGS (was niri's named workspaces)
# ═══════════════════════════════════════════════════════════════════════════════
# mangowm has no named workspaces — just tags 1-9, and (this is the important
# bit) EACH MONITOR HAS ITS OWN INDEPENDENT 1-9 SET. That maps your 11 named
# niri workspaces onto two monitors without losing any of them:
#
#   DP-2 (primary, 4K-left)        DP-1 (secondary, right)
#   ─────────────────────────      ─────────────────────────
#   1 = Browser                    1 = Stream
#   2 = Term                       2 = Comm
#   3 = Gaming                     3 = Music
#   4 = Photo                      4 = Files
#   5 = Media                      5 = Misc
#                                  6 = Leu   (unused / spare, was "launchers")
#
# Mod+1..9 switches tags on whichever monitor currently has focus, so e.g.
# Mod+Shift+Left (focus DP-1) then Mod+2 gets you to "Comm". Keybinds live in
# 10-keybinds.conf.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Per-tag layout ───────────────────────────────────────────────────────────
# niri's scrollable-columns feel is closest to mango's "scroller" layout, so
# that's the default for general-purpose tags. Gaming/Stream/Media get
# "monocle" (one window fills the tag) since that's what "open-maximized"
# was doing for those apps in niri — a single game/stream window filling the
# screen with no visible tiling.

# DP-2
tagrule=id:1,monitor_name:^DP-2$,layout_name:scroller
tagrule=id:2,monitor_name:^DP-2$,layout_name:scroller
tagrule=id:3,monitor_name:^DP-2$,layout_name:monocle
tagrule=id:4,monitor_name:^DP-2$,layout_name:scroller
tagrule=id:5,monitor_name:^DP-2$,layout_name:monocle

# DP-1
tagrule=id:1,monitor_name:^DP-1$,layout_name:monocle
tagrule=id:2,monitor_name:^DP-1$,layout_name:scroller
tagrule=id:3,monitor_name:^DP-1$,layout_name:scroller
tagrule=id:4,monitor_name:^DP-1$,layout_name:scroller
tagrule=id:5,monitor_name:^DP-1$,layout_name:scroller
tagrule=id:6,monitor_name:^DP-1$,layout_name:scroller

# ── App -> tag/monitor routing ────────────────────────────────────────────────
# Converted from your 30-workspaces.kdl `window-rule { match app-id=...;
# open-on-workspace "Name"; }` blocks. Combined multiple `match` lines into a
# single regex alternation since mango's `appid` field is one regex, not a
# repeatable match list.
#
# NOTE on "open-maximized true": mango has no per-rule "maximize" flag —
# tiled windows already fill their tag's available space by default (single
# window on a monocle/scroller tag = fullscreen-ish), so dropping this
# parameter shouldn't change what you see day-to-day.

# Browsers -> Browser (DP-2 tag 1)
windowrule=tags:1,monitor:DP-2,appid:^(brave-browser|firefox|Vivaldi-stable|chromium|zen-alpha|google-chrome)$

# Dev tools -> Term (DP-2 tag 2)
windowrule=tags:2,monitor:DP-2,appid:^(code|org\.kde\.kate)$

# Steam / launchers -> Gaming (DP-2 tag 3)
windowrule=tags:3,monitor:DP-2,appid:^steam$
windowrule=tags:3,monitor:DP-2,appid:^lutris$
windowrule=tags:3,monitor:DP-2,appid:^heroic$
windowrule=tags:3,monitor:DP-2,appid:^battle\.net\.exe$
windowrule=tags:3,monitor:DP-2,appid:^UbisoftConnect\.exe$

# Specific games -> Gaming, fullscreen, with tearing forced on for the
# lowest input latency (allow_tearing=2 in 80-layout-and-monitors.conf
# already covers fullscreen generally, but force_tearing:1 guarantees it
# even if a game doesn't correctly report itself as fullscreen to Wayland)
windowrule=isfullscreen:1,force_tearing:1,tags:3,monitor:DP-2,title:^Cyberpunk 2077$
windowrule=isfullscreen:1,force_tearing:1,tags:3,monitor:DP-2,title:^Fallout4$
windowrule=isfullscreen:1,force_tearing:1,tags:3,monitor:DP-2,title:^The Division 2$

# Modding tool dialogs -> Gaming, floating
windowrule=isfloating:1,tags:3,monitor:DP-2,title:^(Vortex|Mod Organizer|Mod Organizer 2|Wabbajack|Special Offers|Friends List|Steam Settings)$
windowrule=isfloating:1,tags:3,monitor:DP-2,appid:^com\.nexusmods

# Steam toast notifications, pinned near bottom-right (approximation of
# niri's default-floating-position — see NOTES.md for why it's not exact)
windowrule=isfloating:1,offsetx:90,offsety:90,appid:^steam$,title:^notificationtoasts_\d+_desktop$

# Modpack (Wabbajack: The Midnight Ride) -> Misc (DP-1 tag 5)
windowrule=tags:5,monitor:DP-1,appid:^steam_app_0$

# OBS Studio -> Stream (DP-1 tag 1)
# isopensilent:1 = OBS launches without stealing focus, since you usually
# want it running quietly in the background while you're in a game/browser.
# globalkeybinding lets these combos reach OBS even when it's NOT focused —
# but OBS still needs the SAME combos set under OBS's own
# Settings > Hotkeys (Start/Stop Recording, Start/Stop Streaming) or nothing
# will happen when you press them. Pick combos that don't collide with
# anything in 10-keybinds.conf; these two are free.
windowrule=tags:1,monitor:DP-1,isopensilent:1,appid:^com\.obsproject\.Studio$
windowrule=globalkeybinding:ctrl+alt-r,appid:^com\.obsproject\.Studio$
windowrule=globalkeybinding:ctrl+alt-s,appid:^com\.obsproject\.Studio$

# Photography apps -> Photo (DP-2 tag 4)
windowrule=tags:4,monitor:DP-2,appid:^(gimp|gimp-2\.10|darktable|krita|inkscape|digikam|rawtherapee)$

# Video editing -> Media (DP-2 tag 5)
windowrule=tags:5,monitor:DP-2,appid:^(resolve|kdenlive)$

# Communication -> Comm (DP-1 tag 2)
windowrule=tags:2,monitor:DP-1,appid:^(discord|telegramdesktop|slack)$

# Music -> Music (DP-1 tag 3)
windowrule=tags:3,monitor:DP-1,appid:^spotify$

# File managers -> Files (DP-1 tag 4)
windowrule=tags:4,monitor:DP-1,appid:^(thunar|dolphin)$
