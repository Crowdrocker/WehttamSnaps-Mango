# ═══════════════════════════════════════════════════════════════════════════════
# 60 — LAYER RULES
# Converted from niri's `layer-rule { match namespace=...; property; }` to
# mango's `layerrule=layer_name:regex,Param:Value`.
#
# NOT CARRIED OVER:
#   - `place-within-backdrop true` (used for the wallpaper daemon and
#     Noctalia's wallpaper layer, and to keep mako/dunst notifications out of
#     screen shares) — mango has no "overview backdrop" concept the way niri
#     does, and no block-out-from-screencast for layers either. Practically:
#     swww/swaybg just render as the normal background layer with no special
#     rule needed, and notifications will show up in screen recordings (see
#     20-window-rules.conf header for the matching window-rule gap).
# ═══════════════════════════════════════════════════════════════════════════════

# Snappy, no-blur popups for the launcher and notifications (optional — purely
# cosmetic, added since mango supports per-layer animation tuning that niri
# didn't expose the same way)
layerrule=noanim:1,noblur:1,layer_name:^selection$
layerrule=animation_type_open:slide,animation_type_close:fade,layer_name:^notifications$
