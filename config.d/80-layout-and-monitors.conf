# ═══════════════════════════════════════════════════════════════════════════════
# 80 — INPUT, MONITORS, THEMING & EFFECTS
# Converted from niri's `input { }`, `output { }`, `layout { }`, `cursor { }`
# and `gestures { }` blocks. mango has no nested blocks — everything is a flat
# `key=value` line, and outputs/theming are configured with different keywords.
# ═══════════════════════════════════════════════════════════════════════════════

# ── INPUT: Keyboard ─────────────────────────────────────────────────────────
xkb_rules_layout=us
numlockon=1
# Native replacement for the old `xkbset repeat rate 300 50` startup command
# (see 40-startup.conf) — repeat_rate is repeats/sec, repeat_delay is ms
# before repeating starts. Defaults shown; tune to taste.
repeat_rate=25
repeat_delay=300

# ── INPUT: Mouse ────────────────────────────────────────────────────────────
# niri's accel-profile "flat" -> mango's mouse_accel_profile 1 (Flat)
mouse_accel_profile=1
mouse_accel_speed=0.0

# ── INPUT: Focus / general behaviour ────────────────────────────────────────
# niri's `focus-follows-mouse` -> mango's `sloppyfocus` (this is mango's default,
# listed here explicitly so it's easy to flip off).
sloppyfocus=1
# niri's `workspace-auto-back-and-forth` has no 1:1 equivalent in mango. The
# closest analog is `view_current_to_back`, which makes re-pressing the same
# tag key jump back to whichever tag you were on before. Uncomment if you want
# that back-and-forth feel:
# view_current_to_back=1

# ── OUTPUTS ──────────────────────────────────────────────────────────────────
# niri's `output "NAME" { mode; scale; position; }` -> mango's `monitorrule=`
# Run `wlr-randr` to confirm your connector names still match (DP-1 / DP-2 can
# shift after a driver update or cable swap).
#
# Primary monitor (left)
monitorrule=name:^DP-2$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1.0
# Secondary monitor (right, placed directly right of the primary)
monitorrule=name:^DP-1$,width:1920,height:1080,refresh:60,x:1920,y:0,scale:1.0

# niri's `focus-at-startup` on DP-2 has no dedicated monitorrule flag; mango
# focuses whichever monitor your cursor starts on / the first enumerated
# monitor. If it doesn't land on DP-2, add a startup line in 40-startup.conf:
#   exec-once=mmsg dispatch focusmon,DP-2

# ── CURSOR ────────────────────────────────────────────────────────────────────
cursor_theme=Adwaita
cursor_size=24
cursor_hide_timeout=5
cursor_hide_on_keypress=1

# ── GAPS & BORDERS (niri's `layout { gaps; focus-ring; }`) ──────────────────
gappih=6
gappiv=6
gappoh=12
gappov=12
borderpx=4

# niri's focus-ring active/inactive gradients don't have a gradient equivalent
# here — mango borders are solid colors (0xRRGGBBAA). Picking one color from
# each of your niri gradients as the closest match:
bordercolor=0x313244ff
focuscolor=0xff5af1ff
urgentcolor=0xad401fff

# Root/background color shown behind everything (niri: layout.background-color)
rootcolor=0x1e1e2eff

# ── CORNER RADIUS / OPACITY (niri's per-rule geometry-corner-radius, opacity) ─
# mango only exposes ONE global corner radius (no per-app radius like your niri
# rules had for e.g. Vortex vs MO2 vs generic windows — see NOTES.md).
border_radius=20
border_radius_location_default=0
no_radius_when_single=0

# niri's `window-rule { match is-active=false; opacity 0.9; }`
focused_opacity=1.0
unfocused_opacity=0.9

# ── SHADOWS (niri's `layout { shadow { } }`) ─────────────────────────────────
shadows=1
shadow_only_floating=0
shadows_size=30
shadows_blur=15
shadows_position_x=0
shadows_position_y=5
shadowscolor=0x00000070

# ── BLUR ──────────────────────────────────────────────────────────────────────
# niri didn't use blur, but mangowm/scenefx supports it if you want the
# frosted-glass look — off by default here to match your old look 1:1.
blur=0
blur_optimized=1

# ── HOT CORNERS / EDGE-SCROLL / DND (niri's `gestures { }`) ──────────────────
# mango has no direct "hot corners" or "drag near screen edge to switch
# workspace/scroll view" settings in the docs. If you relied on niri's
# top-left hot corner or edge-drag view scrolling, there's no drop-in
# replacement — see NOTES.md.

# ── MISC BEHAVIOUR ────────────────────────────────────────────────────────────
# allow_tearing: 0=disabled, 1=enabled everywhere, 2=fullscreen windows only.
# "2" is the safer choice — tearing only kicks in for fullscreen games (where
# you actually want the latency win) and won't cause artifacts in normal
# tiled/floating apps. Games that explicitly opt in via force_tearing:1
# (see 20-window-rules.conf / 30-tags.conf) get tearing even outside
# fullscreen. Some GPUs need WLR_DRM_NO_ATOMIC=1 in /etc/environment for
# this to work without crashing apps like kitty — see the monitors wiki page
# if you hit issues.
allow_tearing=2
xwayland_persistence=1
warpcursor=1
