# 90 — User Extra
# Converted from your 90-user-extra.kdl. Both of these are already covered by
# the broader Steam/Ubisoft rules in 20-window-rules.conf (steam_app_.* and
# "Ubisoft Connect" are both matched there), but kept here standalone too in
# case you want to tweak just these two independently later.
# ─────────────────────────────────────────────────────────────────────────────

windowrule=isfloating:1,appid:^steam_app_.*$
windowrule=isfloating:1,title:^Ubisoft Connect$

